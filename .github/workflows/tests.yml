name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # PyQt6 is not needed: the GUI is untested and monitor.py's Qt
      # imports are stubbed in tests/conftest.py.
      - run: pip install pytest psutil
      - run: pytest
